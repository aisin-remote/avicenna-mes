# Infrastruktur untuk development lokal.
# Produksi on-prem: pakai docker/compose.data.yml, bukan berkas ini.
services:
  postgres:
    image: postgres:16-bullseye  # samakan mayor dengan server
    container_name: avicenna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: avicenna
      POSTGRES_USER: avicenna
      POSTGRES_PASSWORD: avicenna
      TZ: Asia/Jakarta
      # Laporan per shift memotong waktu memakai CURRENT_DATE dan ::date, dan
      # keduanya mengikuti zona sesi — harus jam dinding pabrik, bukan UTC.
      PGTZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avicenna -d avicenna"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Valkey: fork Redis berlisensi BSD (Linux Foundation), protokol sama persis.
  # BullMQ dan ioredis jalan tanpa perubahan kode apa pun.
  valkey:
    image: valkey/valkey:9-alpine
    container_name: avicenna-valkey
    restart: unless-stopped
    command: valkey-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: avicenna-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  pg_data:
  valkey_data:
