# ─────────────────────────────────────────────────────────────────────────────
# TUMPUKAN DATA — MySQL, Valkey, Mosquitto.
#
# Dipisah dari tumpukan aplikasi dengan sengaja. Keduanya punya siklus hidup
# yang sama sekali berbeda: aplikasi di-deploy ulang tiap ada perubahan, data
# tidak boleh disentuh sama sekali.
#
# Kalau keduanya dalam satu berkas, satu `docker compose down -v` saat deploy —
# yang tangan sudah hafal mengetiknya untuk membersihkan — akan menghapus
# seluruh volume database produksi. Pemisahan ini yang membuat perintah itu
# TIDAK BISA menyentuh data, seberapa pun lelahnya orang yang mengetiknya.
#
#   docker compose -f docker/compose.data.yml up -d
# ─────────────────────────────────────────────────────────────────────────────
name: avicenna-data

# Batas ukuran log, dipasang di SETIAP wadah.
#
# Driver json-file bawaan Docker tumbuh tanpa batas. Aplikasi ini mencatat tiap
# scan, jadi yang pertama kehabisan disk bukan log-nya sendiri melainkan MySQL,
# yang lalu berhenti menerima tulisan — dan lantai produksi berhenti bersamanya.
# 10 MB x 5 berkas = paling banyak 50 MB per wadah.
x-log: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    # Varian bullseye dengan SENGAJA, bukan bookworm (bawaan tag :16).
    #
    # Server produksi masih CentOS 7 berkernel 3.10 dengan libseccomp lama.
    # Image berbasis Debian 12 memakai syscall yang diblokir profil seccomp
    # lama (clone3) dan gagal dengan "Operation not permitted" yang tidak
    # menyebut seccomp sama sekali — kelas kegagalan yang sama dengan EPERM
    # pada image alpine yang sudah pernah kita alami. Bullseye (Debian 11)
    # lolos tanpa melonggarkan seccomp.
    image: postgres:16-bullseye
    container_name: avicenna-postgres
    logging: *log
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avicenna}
      POSTGRES_USER: ${POSTGRES_USER:-avicenna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?wajib diisi di .env}
      TZ: ${TZ:-Asia/Jakarta}
      # Zona waktu SESI database. Kolom waktu bertipe timestamptz sehingga
      # momennya tidak ambigu, tetapi CURRENT_DATE dan ::date — yang dipakai
      # laporan per shift — mengikuti zona ini. Harus jam dinding pabrik.
      PGTZ: ${TZ:-Asia/Jakarta}
    command:
      - postgres
      # Bawaan Postgres 128 MB — ditulis di sini supaya TERLIHAT, bukan supaya
      # berubah. Tabel scan tumbuh belasan juta baris per tahun; begitu lebih
      # besar dari shared_buffers, tiap pembacaan laporan memukul disk.
      # Patokan: sekitar seperempat RAM server yang tidak dipakai hal lain.
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      - -c
      - timezone=${TZ:-Asia/Jakarta}
    ports:
      # Hanya ke localhost server, TIDAK ke seluruh jaringan pabrik.
      #
      # Tanpa awalan 127.0.0.1, Docker membuka 5432 ke semua antarmuka dan
      # melewati aturan firewall host — database jadi terjangkau dari mana pun
      # di jaringan, dan itu tidak terlihat di `ufw status`.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Subdirektori PGDATA, bukan akar volume: direktori data Postgres harus
      # kosong saat initdb, sedangkan akar volume bisa berisi lost+found.
      - pg_data:/var/lib/postgresql/data
    networks: [avicenna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avicenna} -d ${POSTGRES_DB:-avicenna}"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Jendela longgar: initdb pada pemasangan pertama memakan waktu, dan
      # wadah yang ditandai tidak sehat lalu di-restart di tengah inisialisasi
      # meninggalkan direktori data yang separuh jadi.
      start_period: 60s

  # Valkey: fork Redis berlisensi BSD (Linux Foundation), protokol sama persis.
  # BullMQ dan ioredis jalan tanpa perubahan kode apa pun.
  valkey:
    image: valkey/valkey:9-alpine
    container_name: avicenna-valkey
    logging: *log
    restart: unless-stopped
    # appendonly: antrean yang belum sempat dikerjakan selamat dari restart.
    # Tanpa itu, backflush dan hitung-ulang saldo yang tertunda hilang diam-diam
    # saat server dinyalakan ulang — stok jadi salah tanpa jejak sebabnya.
    command: valkey-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    networks: [avicenna]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: avicenna-mqtt
    logging: *log
    restart: unless-stopped
    ports:
      - "${MQTT_BIND:-127.0.0.1}:${MQTT_PORT:-1883}:1883"
    volumes:
      - ../docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    networks: [avicenna]

volumes:
  pg_data:
  valkey_data:
  mosquitto_data:

networks:
  # Dibuat DI SINI, dipakai tumpukan aplikasi sebagai jaringan eksternal.
  # Namanya dipatok supaya tidak berubah mengikuti nama folder.
  avicenna:
    name: avicenna-net
