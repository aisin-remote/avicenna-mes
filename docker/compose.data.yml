# ─────────────────────────────────────────────────────────────────────────────
# TUMPUKAN DATA — MySQL, Valkey, Mosquitto.
#
# Dipisah dari tumpukan aplikasi dengan sengaja. Keduanya punya siklus hidup
# yang sama sekali berbeda: aplikasi di-deploy ulang tiap ada perubahan, data
# tidak boleh disentuh sama sekali.
#
# Kalau keduanya dalam satu berkas, satu `docker compose down -v` saat deploy —
# yang tangan sudah hafal mengetiknya untuk membersihkan — akan menghapus
# seluruh volume database produksi. Pemisahan ini yang membuat perintah itu
# TIDAK BISA menyentuh data, seberapa pun lelahnya orang yang mengetiknya.
#
#   docker compose -f docker/compose.data.yml up -d
# ─────────────────────────────────────────────────────────────────────────────
name: avicenna-data

# Batas ukuran log, dipasang di SETIAP wadah.
#
# Driver json-file bawaan Docker tumbuh tanpa batas. Aplikasi ini mencatat tiap
# scan, jadi yang pertama kehabisan disk bukan log-nya sendiri melainkan MySQL,
# yang lalu berhenti menerima tulisan — dan lantai produksi berhenti bersamanya.
# 10 MB x 5 berkas = paling banyak 50 MB per wadah.
x-log: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    container_name: avicenna-mysql
    logging: *log
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?wajib diisi di .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-avicenna}
      MYSQL_USER: ${MYSQL_USER:-avicenna}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?wajib diisi di .env}
      TZ: ${TZ:-Asia/Jakarta}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Zona waktu server disamakan dengan TZ aplikasi.
      #
      # Kolom yang diisi Node dan kolom ber-DEFAULT CURRENT_TIMESTAMP ditulis
      # dua pihak yang berbeda. Kalau zonanya beda, dua kolom waktu di BARIS
      # YANG SAMA bisa selisih tujuh jam — dan laporan per shift ikut salah
      # tanpa ada satu pun galat yang muncul.
      - --default-time-zone=+07:00
      # Bawaan MySQL 128 MB — ditulis di sini supaya TERLIHAT, bukan supaya
      # berubah. Tabel scan tumbuh belasan juta baris per tahun; begitu ia
      # lebih besar dari buffer pool, tiap pembacaan laporan memukul disk.
      # Patokan: sekitar setengah RAM server yang tidak dipakai hal lain.
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-128M}
    ports:
      # Hanya ke localhost server, TIDAK ke seluruh jaringan pabrik.
      #
      # Tanpa awalan 127.0.0.1, Docker membuka 3306 ke semua antarmuka dan
      # melewati aturan firewall host — database jadi terjangkau dari mana pun
      # di jaringan, dan itu tidak terlihat di `ufw status`.
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [avicenna]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Jendela longgar: MySQL membangun ulang InnoDB saat pertama kali menyala,
      # dan pada disk lambat itu bisa lebih dari semenit. Terlalu pendek membuat
      # wadah ditandai tidak sehat lalu di-restart di tengah inisialisasi.
      start_period: 90s

  # Valkey: fork Redis berlisensi BSD (Linux Foundation), protokol sama persis.
  # BullMQ dan ioredis jalan tanpa perubahan kode apa pun.
  valkey:
    image: valkey/valkey:9-alpine
    container_name: avicenna-valkey
    logging: *log
    restart: unless-stopped
    # appendonly: antrean yang belum sempat dikerjakan selamat dari restart.
    # Tanpa itu, backflush dan hitung-ulang saldo yang tertunda hilang diam-diam
    # saat server dinyalakan ulang — stok jadi salah tanpa jejak sebabnya.
    command: valkey-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    networks: [avicenna]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: avicenna-mqtt
    logging: *log
    restart: unless-stopped
    ports:
      - "${MQTT_BIND:-127.0.0.1}:${MQTT_PORT:-1883}:1883"
    volumes:
      - ../docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    networks: [avicenna]

volumes:
  mysql_data:
  valkey_data:
  mosquitto_data:

networks:
  # Dibuat DI SINI, dipakai tumpukan aplikasi sebagai jaringan eksternal.
  # Namanya dipatok supaya tidak berubah mengikuti nama folder.
  avicenna:
    name: avicenna-net
